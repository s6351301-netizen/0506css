<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    table {
        border: 1px solid rgb(243, 6, 6);
        width: 500px;
        height: 200px;
    }

    td {
        border: 1px solid rgb(0, 0, 0);
    }

        tr {
        border: 1px solid rgb(4, 18, 214);
    }

</style>

<body>
    <table border="1" cellpadding="10" cellspacing="0" style="border-collapse: collapse; text-align: center;">
    <!-- 第一列：將 1-1 至 1-4 合併成一格 -->
    <tr>
        <td colspan="4">第一列 (1-1至1-4)</td>
    </tr>
    <!-- 第二列：將 2-1與2-2 合併，2-3與2-4 合併 -->
    <tr>
        <td colspan="2">2-1 & 2-2 合併</td>
        <td colspan="2">2-3 & 2-4 合併</td>
    </tr>
    <!-- 第三列：將 3-1, 3-2, 3-3 合併成一格，第四格獨立 -->
    <tr>
        <td colspan="3">3-1, 3-2, 3-3 合併</td>
        <td>3-4</td>
    </tr>
    <!-- 第四列：獨立 4 格 -->
    <tr>
        <td>4-1</td>
        <td>4-2</td>
        <td>4-3</td>
        <td>4-4</td>
    </tr>
</table>

    
    <hr>
    
    <!--colspan="4" !-->
   <table>
    <td>        
        <tr>11</tr>
        <tr>12</tr>
        <tr>13</tr>
        <tr>14</tr>       
    </td>
    <td>
        <tr>21</tr>
        <tr>22</tr>
        <tr>23</tr>
        <tr>24</tr>
    </td>
    <td>
        <tr>31</tr>
        <tr>32</tr>
        <tr>33</tr>
        <tr>34</tr>
    </td>
    <td>
        <tr>41</tr>
        <tr>42</tr>
        <tr>43</tr>
        <tr>44</tr>
    </td>
   </table>
    
</body>
</html>

        width: 500px;

        border: 1px solid black;
        padding: 5px;

<body>
    <h1>變數宣告</h1>
    <div class="box">
    <p>在PHP中，變數一律加上$這個符號即可，由於PHP本質是一種直譯式的描述性語言，
        因此在宣告變數時不需要再指定資料型態。宣告變數時，第一個字元不要是數字，
        其它規則很自由；要注意命名儘量是容易閱讀的，方便之後的維護。</p>
    </div>
